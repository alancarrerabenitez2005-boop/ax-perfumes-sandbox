{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AX Perfumes{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tipografías -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent-blue: #2A3B68;
            --accent-light-blue: #4A6296;
            --glass-bg: rgba(10, 15, 30, 0.60);
            --glass-border: rgba(255, 255, 255, 0.18);
        }

        body {
            background: linear-gradient(135deg, rgba(6, 9, 20, 0.75) 0%, rgba(15, 20, 45, 0.85) 100%), 
                        url("{% static 'usuarios/images/fondo-chanel.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
        }

        h1, h2, h3, .brand-title {
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff !important;
            border-radius: 6px;
            padding: 0.75rem 1rem;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-light-blue);
            box-shadow: 0 0 12px rgba(74, 98, 150, 0.5);
        }

        .btn-custom {
            background: linear-gradient(135deg, #1f2d52 0%, #344878 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
            padding: 0.85rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background: linear-gradient(135deg, #2a3d6d 0%, #445d99 100%);
            border-color: rgba(255, 255, 255, 0.4);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .brand-title {
            font-size: 3.2rem;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    {% block content %}
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
